<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>User Profile</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

</head>
<body>

<nav class="navbar">
  <div class="nav-left">
    <h1><a href="/">StackIt</a></h1>
  </div>

  <div class="nav-right">
    <div class="theme-switch">
      <input type="checkbox" id="themeToggle" />
      <label for="themeToggle" class="switch">
        <span class="sun">☀️</span>
        <span class="moon">🌙</span>
      </label>
    </div>

    <button id="profile-logout-btn" class="nav-btn-outline" style="display:none;">
      Logout
    </button>
  </div>
</nav>

<main>
  <div id="profile-container">

    <div class="profile-avatar-wrapper">
      <img id="avatarImg" class="profile-avatar" />
      <label for="avatarInput" class="avatar-plus">+</label>
      <input type="file" id="avatarInput" accept="image/*" hidden />
    </div>

    <textarea id="bioInput" placeholder="Write your bio..."></textarea>
    <button id="saveProfileBtn" class="nav-btn">Save</button>

  </div>
</main>


<script src="js/util.js"></script>
<script src="js/theme.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
